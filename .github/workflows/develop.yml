name: Publish Pre-release NuGet Package (Develop)

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Pack NuGet package with pre-release suffix
        run: |
          VERSION=$(dotnet msbuild -nologo -t:GetVersion -v:q -property:Version)
          SUFFIX="alpha"
          dotnet pack --configuration Release --no-build --output ./nupkg /p:Version="$VERSION-$SUFFIX"

      - name: Publish NuGet package
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
